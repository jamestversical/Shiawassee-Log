<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shiawassee Ranch Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--paper:#f2efe7;
--paper-dark:#e5e0d5;
--card:#f8f6f0;
--line:#cec8bb;
--text:#2f342f;
--muted:#76756d;
--accent:#6b874f;
--accent2:#4f6739;
--danger:#b4423a;
--shadow:0 10px 26px rgba(45,40,29,.10);
--top:#222622;
--top-2:#313730;
}
*{box-sizing:border-box;}
body{
margin:0;
min-height:100vh;
font-family:Inter,"Segoe UI",Arial,sans-serif;
color:var(--text);
background:radial-gradient(circle at 20% 0%, rgba(255,255,255,.4), transparent 55%), linear-gradient(180deg, var(--paper-dark), var(--paper));
padding:0;
}
.masthead{
background:linear-gradient(90deg,var(--top),var(--top-2),var(--top));
border-bottom:2px solid var(--accent);
color:#f4f0e6;
padding:16px;
}
.masthead h1{margin:0;font-size:2rem;}
.brand-wrap{display:flex;align-items:center;gap:12px;}
.logo-badge{width:56px;height:56px;border-radius:14px;border:3px solid #f2f2eb;background:linear-gradient(180deg,#3b4f45,#24342d);color:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);overflow:hidden;}
.masthead .sub{color:#b5b3aa;font-size:.95rem;letter-spacing:.03em;}
.wrap{min-height:calc(100vh - 92px);display:grid;place-items:center;padding:18px;}
.title{margin:0;font-size:1.8rem;}
.subtitle{margin-top:2px;}
.card h2{margin:0;}
.card .muted{margin-top:-4px;}
.title-sm{font-size:1rem;text-transform:uppercase;letter-spacing:.07em;color:#777366;}
.card-wrap{width:min(560px,100%);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tabs button{flex:1;}
.tabs button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tabs button:not(.primary){background:#f4f2eb;}
.card{
width:100%;
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
box-shadow:var(--shadow);
display:grid;
gap:12px;
}
.card h1{font-family:Georgia,"Times New Roman",serif;}
input,button{font:inherit;color:var(--text);}
input{
width:100%;
border:1px solid var(--line);
border-radius:10px;
padding:10px 12px;
background:#fff;
}
button{
border:1px solid var(--line);
border-radius:10px;
padding:10px;
cursor:pointer;
background:#f4f2eb;
}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.hidden{display:none!important;}
.muted{color:var(--muted);font-size:.9rem;}
.error{color:var(--danger);}
.ok{color:#3f7a51;}
@media (max-width:600px){
  .masthead{padding:12px;}
  .masthead h1{font-size:1.35rem;}
  .logo-badge{width:44px;height:44px;}
  .wrap{padding:12px;}
  .card{padding:14px;border-radius:14px;}
  .tabs{gap:6px;}
  .tabs button{min-width:100%;}
}
</style>
</head>

<body>
<header class="masthead">
  <div class="brand-wrap">
    <div class="logo-badge">🦌</div>
    <div>
      <h1>Shiawassee Ranch Est. 1965</h1>
      <div class="sub">CURRAN, MICHIGAN</div>
    </div>
  </div>
</header>
<div class="wrap">
<section class="card card-wrap">

<h1>Shiawassee Ranch Digital Log</h1>
<div class="muted">Sign in, create account, or reset password</div>

<div class="tabs">
<button id="showSignInBtn" class="primary">Sign In</button>
<button id="showSignUpBtn">Create Account</button>
<button id="showForgotBtn">Forgot Password</button>
</div>

<form id="signInForm">
<label>Email<input id="signInEmail" type="email" required></label>
<label>Password<input id="signInPassword" type="password" required></label>
<button class="primary">Sign In</button>
</form>

<form id="signUpForm" class="hidden">
<label>Email<input id="signUpEmail" type="email" required></label>
<label>Password<input id="signUpPassword" type="password" required></label>
<button class="primary">Create Account</button>
</form>

<form id="forgotForm" class="hidden">
<label>Email<input id="forgotEmail" type="email" required></label>
<button class="primary">Send Reset</button>
</form>

<div id="authMsg" class="muted"></div>

</section>
</div>

<script>

const SUPABASE_URL="https://gpbusqwvjjhpwitoovkd.supabase.co";

const SUPABASE_ANON_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwYnVzcXd2ampocHdpdG9vdmtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMjQwNzgsImV4cCI6MjA4NzcwMDA3OH0.DyZZRZQ3X3onQh0Dxkcb1AdRq9Tcxf1XTUhR6nf3rQ8";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id)

function msg(t,c="muted"){const e=$("authMsg");e.className=c;e.textContent=t}

function show(p){
$("signInForm").classList.toggle("hidden",p!=="in")
$("signUpForm").classList.toggle("hidden",p!=="up")
$("forgotForm").classList.toggle("hidden",p!=="forgot")
}

$("showSignInBtn").onclick=()=>show("in")
$("showSignUpBtn").onclick=()=>show("up")
$("showForgotBtn").onclick=()=>show("forgot")

$("signInForm").onsubmit=async e=>{
e.preventDefault()

const email=$("signInEmail").value
const password=$("signInPassword").value

msg("Signing in...")

const {error}=await sb.auth.signInWithPassword({email,password})

if(error)return msg(error.message,"error")

window.location.href="index.html"
}

$("signUpForm").onsubmit=async e=>{
e.preventDefault()

const email=$("signUpEmail").value
const password=$("signUpPassword").value

msg("Creating account...")

const {error}=await sb.auth.signUp({
email,
password,
options:{emailRedirectTo:window.location.origin+"/login.html"}
})

if(error)return msg(error.message,"error")

msg("Check your email to confirm.","ok")
show("in")
}

$("forgotForm").onsubmit=async e=>{
e.preventDefault()

const email=$("forgotEmail").value

msg("Sending reset email...")

const {error}=await sb.auth.resetPasswordForEmail(email,{
redirectTo:window.location.origin+"/reset.html"
})

if(error)return msg(error.message,"error")

msg("Reset email sent.","ok")
}

</script>
</body>
</html>
